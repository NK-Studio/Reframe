[package]
name = "reframe"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "ffmpeg 기반 영상 화면 영역(가로·세로) 크롭 도구"
repository = "https://github.com/NK-Studio/video-crop"

[lib]
name = "reframe_core"
path = "src/lib.rs"

# GUI 앱
[[bin]]
name = "Reframe"
path = "src/main.rs"

# 명령줄 도구 (창 없이 크롭·내보내기)
[[bin]]
name = "reframe-cli"
path = "src/bin/reframe-cli.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
wry = "0.57.0"
